<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Âncora — Entrar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { display: ['Manrope','sans-serif'], body: ['Inter','sans-serif'] },
        colors: {
          cream:'#F3F1EA', paper:'#FFFFFF', ink:'#2B3532', mute:'#6E7A76',
          sage:{ DEFAULT:'#6E9080', light:'#E4EBE6', dim:'#DCE6E0' },
          clay:{ DEFAULT:'#C98A5E', light:'#F3E3D6', dim:'#EFDCC9' },
          rose:{ DEFAULT:'#A9614C', light:'#F1E0D9', dim:'#EAD2C6' },
          line:'#E4E1D8',
        },
        keyframes: { rise:{'0%':{transform:'translateY(10px)',opacity:'0'},'100%':{transform:'translateY(0)',opacity:'1'}} },
        animation: { rise:'rise 0.5s ease-out' }
      }
    }
  }
</script>
<style>
  html, body { background:#F3F1EA; }
  .focus-ring:focus-visible { outline:2px solid #6E9080; outline-offset:2px; }
  input:focus { outline:none; }
  .field:focus-within { border-color:#6E9080; background:#fff; }
</style>
</head>

<body class="font-body text-ink antialiased min-h-screen flex items-center justify-center px-4 py-10">

<div class="w-full max-w-sm animate-rise">

  <!-- Logo -->
  <div class="flex flex-col items-center mb-8">
    <div class="w-14 h-14 rounded-2xl bg-sage-light flex items-center justify-center ring-1 ring-sage/25 mb-3">
      <i data-lucide="anchor" class="w-6 h-6 text-sage"></i>
    </div>
    <p class="font-display font-bold text-xl text-ink tracking-tight">Âncora</p>
    <p class="text-[12px] text-mute mt-0.5">firme, mesmo quando balança</p>
  </div>

  <!-- Card de login -->
  <div class="rounded-3xl bg-paper ring-1 ring-line p-6 sm:p-7">
    <h1 class="font-display font-bold text-lg text-ink">Bem-vindo de volta</h1>
    <p class="text-[12.5px] text-mute mt-1 mb-6">Entre para continuar seu acompanhamento.</p>

    <form id="login-form" class="space-y-4">
      <div>
        <label for="login-email" class="text-[11px] text-mute font-medium uppercase tracking-wide">E-mail</label>
        <div class="field mt-1.5 flex items-center gap-2 rounded-xl bg-cream ring-1 ring-line px-3.5 py-3 transition">
          <i data-lucide="mail" class="w-4 h-4 text-mute shrink-0"></i>
          <input id="login-email" type="email" required placeholder="voce@email.com"
                 class="w-full bg-transparent text-[13.5px] text-ink placeholder:text-mute/60">
        </div>
      </div>

      <div>
        <label for="login-senha" class="text-[11px] text-mute font-medium uppercase tracking-wide">Senha</label>
        <div class="field mt-1.5 flex items-center gap-2 rounded-xl bg-cream ring-1 ring-line px-3.5 py-3 transition">
          <i data-lucide="lock" class="w-4 h-4 text-mute shrink-0"></i>
          <input id="login-senha" type="password" required placeholder="••••••••"
                 class="w-full bg-transparent text-[13.5px] text-ink placeholder:text-mute/60">
        </div>
      </div>

      <p id="login-error" class="hidden text-[11.5px] text-rose">Preencha e-mail e senha para continuar.</p>

      <button type="submit" class="focus-ring w-full px-4 py-3 rounded-xl bg-sage text-white text-sm font-semibold hover:brightness-105 transition flex items-center justify-center gap-2">
        Entrar <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <div class="flex items-center gap-3 my-5">
      <div class="flex-1 h-px bg-line"></div>
      <span class="text-[10.5px] text-mute">ou</span>
      <div class="flex-1 h-px bg-line"></div>
    </div>

    <a href="cadastro.html" class="focus-ring w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-cream ring-1 ring-line text-ink text-sm font-medium hover:bg-sage-light transition">
      <i data-lucide="user-plus" class="w-4 h-4 text-sage"></i> Não tenho uma conta
    </a>
  </div>

  <p class="text-center text-[10.5px] text-mute/70 mt-6 leading-relaxed px-4">
    Ambiente de demonstração — nenhum dado é enviado a um servidor. Use qualquer e-mail e senha para testar.
  </p>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
  lucide.createIcons();

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const senha = document.getElementById('login-senha').value.trim();
    const errorEl = document.getElementById('login-error');

    if (!email || !senha) {
      errorEl.classList.remove('hidden');
      return;
    }
    errorEl.classList.add('hidden');

    // Deriva um nome de exibição a partir do e-mail (sem backend, apenas para o teste)
    const prefix = email.split('@')[0].replace(/[._\-\d]+/g, ' ').trim();
    const nome = prefix
      ? prefix.split(' ').filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')
      : 'Visitante';

    window.location.href = 'estado.html?nome=' + encodeURIComponent(nome);
  });
</script>
</body>
</html>
